# Dosya Yolu: REPO_ROOT/.github/workflows/burak_manga_launcher.yml
# Amac: Native Rust Windows baslaticisini derler ve test ZIP artifacti uretir
# Modul - YAML
# Version: 0.4.0
# Aciklama: Windows x64 build, test, Clippy, checksum ve paket kontrolu
# Bagimli Oldugu Katman: Testing
name: Burak Manga - Rust launcher
on:
  push:
    branches: [develop/burak-manga]
    paths:
      - 'deploy/burak-manga/launcher-rust/**'
      - 'deploy/burak-manga/Launcher.cmd'
      - '.github/workflows/burak_manga_launcher.yml'
  pull_request:
    paths:
      - 'deploy/burak-manga/launcher-rust/**'
      - 'deploy/burak-manga/Launcher.cmd'
      - '.github/workflows/burak_manga_launcher.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: deploy/burak-manga/launcher-rust
    steps:
      - uses: actions/checkout@v4
      - name: Stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cargo formatting in ephemeral checkout
        run: cargo fmt --all
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Unit tests
        run: cargo test
      - name: Turkish WebUI installer tests (mock Docker only)
        shell: pwsh
        run: ../tests/test_turkish_webui_install.ps1
      - name: Release build
        run: cargo build --release
      - name: Portable layout smoke and ZIP integrity
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stage = Join-Path $env:RUNNER_TEMP 'Burak Manga Test'
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item '.\target\release\BurakMangaLauncher.exe' (Join-Path $stage 'BurakMangaLauncher.exe')
          Copy-Item '..\compose.yaml' (Join-Path $stage 'compose.yaml')
          $smoke = Start-Process -FilePath (Join-Path $stage 'BurakMangaLauncher.exe') -ArgumentList '--check-layout' -Wait -PassThru
          Write-Host "Layout smoke exit code: $($smoke.ExitCode)"
          if ($smoke.ExitCode -ne 0) { throw "PORTABLE_LAYOUT_FAILED: exit=$($smoke.ExitCode)" }
          $gui = Start-Process -FilePath (Join-Path $stage 'BurakMangaLauncher.exe') -ArgumentList '--smoke-gui' -Wait -PassThru
          Write-Host "Win32 GUI creation/close smoke exit code: $($gui.ExitCode)"
          if ($gui.ExitCode -ne 0) { throw "WIN32_GUI_SMOKE_FAILED: exit=$($gui.ExitCode)" }
          $dist = Join-Path $env:RUNNER_TEMP 'BurakMangaDist'
          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          $exe = Join-Path $dist 'BurakMangaLauncher.exe'
          Copy-Item (Join-Path $stage 'BurakMangaLauncher.exe') $exe
          $hash = (Get-FileHash -Algorithm SHA256 $exe).Hash.ToLowerInvariant()
          "$hash  BurakMangaLauncher.exe" | Set-Content -Path (Join-Path $dist 'SHA256SUMS.txt') -Encoding ascii
          Copy-Item '..\LAUNCHER.md' (Join-Path $dist 'README.md')
          $zipPath = 'BurakMangaLauncher-Windows-x64.zip'
          Compress-Archive -Path (Join-Path $dist '*') -DestinationPath $zipPath -Force
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $zipPath))
          try {
            $actual = @($archive.Entries | ForEach-Object Name)
            foreach ($item in @('BurakMangaLauncher.exe', 'SHA256SUMS.txt', 'README.md')) {
              if ($item -notin $actual) { throw "ZIP_ENTRY_MISSING: $item" }
            }
          } finally { $archive.Dispose() }
          $extract = Join-Path $env:RUNNER_TEMP 'BurakMangaZipAudit'
          Expand-Archive -Path $zipPath -DestinationPath $extract -Force
          $insideHash = (Get-FileHash -Algorithm SHA256 (Join-Path $extract 'BurakMangaLauncher.exe')).Hash.ToLowerInvariant()
          if ($hash -ne $insideHash) { throw 'ZIP_EXE_CHECKSUM_MISMATCH' }
      - name: Upload test artifact
        uses: actions/upload-artifact@v4
        with:
          name: burak-manga-rust-windows-x64
          path: deploy/burak-manga/launcher-rust/BurakMangaLauncher-Windows-x64.zip
          retention-days: 7
          if-no-files-found: error
