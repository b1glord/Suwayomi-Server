# Dosya Yolu: REPO_ROOT/deploy/burak-manga/compose.yaml
# Amac: Yerel Suwayomi ve Cloudflare yardimcisini Docker aginda calistirir
# Modul - YAML
# Version: 0.2.0
# Aciklama: Resmi stable sunucu, dahili Byparr yardimcisi ve kalici host verisi
# Bagimli Oldugu Katman: Infrastructure
services:
  suwayomi:
    image: ghcr.io/suwayomi/suwayomi-server:stable
    init: true
    environment:
      TZ: Europe/Istanbul
      DOWNLOAD_AS_CBZ: "true"
      FLARESOLVERR_ENABLED: "true"
      FLARESOLVERR_URL: "http://flaresolverr:8191"
      FLARESOLVERR_TIMEOUT: "60"
    depends_on:
      - flaresolverr
    ports:
      - "127.0.0.1:4567:4567"
    volumes:
      - ./storage/Tachidesk:/home/suwayomi/.local/share/Tachidesk
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  flaresolverr:
    # Upstream Suwayomi uses the FlareSolverr-compatible Byparr API.
    image: ghcr.io/thephaseless/byparr:v3.0.4
    environment:
      TZ: Europe/Istanbul
    shm_size: "512mb"
    # Deliberately no "ports": the service is reachable only inside the
    # Docker Compose network, at http://flaresolverr:8191.
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
