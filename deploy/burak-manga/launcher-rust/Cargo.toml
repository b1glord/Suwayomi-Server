# Dosya Yolu: REPO_ROOT/deploy/burak-manga/launcher-rust/Cargo.toml
# Amac: Native Windows Rust manga baslaticisinin crate tanimi
# Modul - TOML
# Version: 0.6.0
# Aciklama: Windows SDK ile tek EXE, ek GUI runtime yok
# Bagimli Oldugu Katman: Application
[package]
name = "burak-manga-launcher"
version = "0.6.0"
edition = "2021"
rust-version = "1.83"
publish = false

[[bin]]
name = "BurakMangaLauncher"
path = "src/main.rs"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging"
] }
